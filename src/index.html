<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Mapbox</title>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.css">
  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      background-color: #111;
    }
    #map {
      height: 100vh;
    }
    .controls-container {
      background-color: #eee;
    }
    #map.is-blurred {
      filter: blur(8px) brightness(0.6);
    }
    .cs-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #eee;
    }
    .cs-card {
      width: min(720px, 100%);
      max-height: 100%;
      overflow: auto;
      box-sizing: border-box;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(17, 17, 17, 0.85);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    }
    .cs-card h1 {
      margin: 0 0 16px;
      font-size: 22px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .cs-body {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
    }
    @media (max-width: 560px) {
      .cs-body { grid-template-columns: 1fr; }
    }
    .cs-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cs-option {
      display: grid;
      grid-template-columns: 48px 1fr;
      grid-template-rows: auto auto;
      column-gap: 12px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      cursor: pointer;
    }
    .cs-option:hover { background: rgba(255, 255, 255, 0.08); }
    .cs-option:has(input:checked) {
      border-color: #4fc3f7;
      background: rgba(79, 195, 247, 0.15);
    }
    .cs-option:has(input:focus-visible) { outline: 2px solid #fff; outline-offset: 2px; }
    .cs-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .cs-option img {
      grid-row: 1 / 3;
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .cs-option__name { font-weight: 600; }
    .cs-option__role { font-size: 12px; color: #aaa; }
    .cs-detail {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .cs-detail__image {
      align-self: center;
      height: 180px;
      max-width: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .cs-detail__name { margin: 0; font-size: 20px; }
    .cs-detail__role { margin: 0 0 8px; color: #aaa; }
    .cs-detail__weapons { margin: 8px 0 0; font-size: 13px; color: #ccc; }
    .cs-stat {
      display: grid;
      grid-template-columns: 64px 1fr 32px;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .cs-stat__bar {
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }
    .cs-stat__bar i {
      display: block;
      height: 100%;
      background: #4fc3f7;
      transition: width 0.2s ease;
    }
    .cs-stat__value { text-align: right; font-variant-numeric: tabular-nums; }
    .cs-start {
      display: block;
      margin: 20px 0 0 auto;
      padding: 10px 32px;
      border: 0;
      border-radius: 8px;
      background: #4fc3f7;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .cs-start:hover { background: #81d4fa; }
    .cs-start:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .weapon-indicator {
      position: fixed;
      left: 16px;
      bottom: 48px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(17, 17, 17, 0.75);
      color: #eee;
      font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .weapon-indicator.is-armed {
      border-color: rgb(40, 140, 255);
      color: rgb(40, 140, 255);
      font-weight: 700;
    }
    .perf-hud {
      position: fixed;
      top: 12px;
      left: 12px;
      min-width: 120px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(17, 17, 17, 0.75);
      color: #eee;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: none;
    }
    .perf-hud b {
      display: inline-block;
      min-width: 84px;
      font-weight: 600;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="text/javascript" src="https://api.mapbox.com/mapbox-gl-js/v1.13.3/mapbox-gl.js"></script>
</body>
</html>
